services:
  app:
    build: .
    container_name: sockets-tp-app
    ports:
      - "3000:3000"
    environment:
      port: ":3000"
      DATABASE_URL: "postgres://tickets:tickets@db:5432/tickets?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: sockets-tp-migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://tickets:tickets@db:5432/tickets?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: sockets-tp-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: